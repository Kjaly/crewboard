<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сайдбар</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root{color-scheme:dark;--bg:#111113;--surface:#18181b;--surface-2:#1f1f23;--line:#2a2a2f;--line-strong:#3a3a40;--text:#ededef;--text-2:#a7a7ae;--text-3:#75757c;--accent:#f0884f;--accent-soft:#3a2216;--accent-text:#f6a77a;--ok:#55b38a;--ease-out:cubic-bezier(.23,1,.32,1)}
:root[data-theme=light]{color-scheme:light;--bg:#f6f6f4;--surface:#fff;--surface-2:#f0f0ed;--line:#e3e3df;--line-strong:#cfcfca;--text:#18181b;--text-2:#55555c;--text-3:#85858c;--accent:#c2410c;--accent-soft:#fdeee5;--accent-text:#9a330a;--ok:#2f7d5b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.side{flex:none;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;height:fit-content}
.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px}
.brand b{font-weight:600}.brand span{display:flex;gap:2px}
.ib{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-3)}
@media (hover:hover) and (pointer:fine){.ib:hover{background:var(--surface-2);color:var(--text)}}
.proj{margin-top:4px}
.phd{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;width:100%;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--text-3);transition:background-color 140ms}
@media (hover:hover) and (pointer:fine){.phd:hover{background:var(--surface-2);color:var(--text-2)}}
.phd .car{transition:transform 180ms var(--ease-out);font-size:11px}
.proj.closed .phd .car{transform:rotate(-90deg)}
.phd .sum{display:flex;gap:6px;align-items:center}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.cnt{font-size:11.5px;color:var(--text-3)}
.list{display:grid;grid-template-rows:1fr;transition:grid-template-rows 200ms var(--ease-out)}
.proj.closed .list{grid-template-rows:0fr}
.list>div{overflow:hidden}
.g{position:relative;display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:start;width:100%;padding:7px 8px 7px 10px;margin:1px 0;border-radius:8px;transition:background-color 140ms,transform 140ms var(--ease-out)}
.g:active{transform:scale(.99)}
@media (hover:hover) and (pointer:fine){.g:hover{background:var(--surface-2)}}
.g[aria-current=true]{background:var(--surface-2)}
.g[aria-current=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.st{width:18px;height:18px;display:grid;place-items:center;margin-top:1px;font-size:14px}
.st.run i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block;position:relative}
.st.run i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok);opacity:0;animation:ping 1.8s var(--ease-out) infinite}
@keyframes ping{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
.st.ask{color:var(--accent)} .st.lead{color:var(--text-2)} .st.done{color:var(--text-3)} .st.pause{color:var(--text-3)}
.gt{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g.fin .gt{color:var(--text-2)}
.gs{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--text-3)}
.gs .ask{color:var(--accent-text)}
.lead{width:13px;height:13px;display:inline-grid;place-items:center}.lead svg{width:12px;height:12px}
.right{display:flex;align-items:center;gap:4px;margin-top:1px}
.more{opacity:0;transition:opacity 120ms}
@media (hover:hover) and (pointer:fine){.g:hover .more{opacity:1}}
.fold{display:flex;justify-content:flex-start;white-space:nowrap;align-items:center;gap:6px;width:100%;padding:5px 10px;margin-top:2px;border-radius:7px;font-size:12px;color:var(--text-3)}
@media (hover:hover) and (pointer:fine){.fold:hover{background:var(--surface-2);color:var(--text-2)}}
.fold .car{font-size:11px;transition:transform 180ms var(--ease-out)}
.fold[aria-expanded=false] .car{transform:rotate(-90deg)}
.fin-list[hidden]{display:none}
.note{max-width:420px;color:var(--text-2);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="wrap">
<aside class="side" aria-label="Цели">
 <div class="brand"><b>Crewboard</b><span><button class="ib" aria-label="Тема" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'"><i class="ph ph-circle-half"></i></button><button class="ib" aria-label="Свернуть сайдбар"><i class="ph ph-sidebar-simple"></i></button></span></div>
 <section class="proj" id="p1">
  <button class="phd" aria-expanded="true" onclick="tog('p1',this)"><i class="ph ph-caret-down car"></i><span>dsh-orchestra</span><span class="sum"><span class="cnt">1 идёт</span></span></button>
  <div class="list"><div>
   <button class="g" aria-current="true"><span class="st run"><i></i></span><span><div class="gt">A feed people can read, and the release review fixes</div><div class="gs"><span class="lead">CLAUDE</span>2 идут</div></span><span class="right"><span class="ib more" aria-label="Ещё"><i class="ph ph-dots-three"></i></span></span></button>
   <button class="fold" aria-expanded="false" onclick="fold(this)"><i class="ph ph-caret-down car"></i>Завершено 4</button>
   <div class="fin-list" hidden>
    <button class="g fin"><span class="st done"><i class="ph ph-check-circle"></i></span><span><div class="gt">Fix what the orchestration run found</div><div class="gs"><span class="lead">CLAUDE</span>сегодня 01:30</div></span><span></span></button>
    <button class="g fin"><span class="st done"><i class="ph ph-check-circle"></i></span><span><div class="gt">Model and effort per assignment, clearer node actions</div><div class="gs"><span class="lead">CLAUDE</span>сегодня 00:55</div></span><span></span></button>
    <button class="g fin"><span class="st done"><i class="ph ph-check-circle"></i></span><span><div class="gt">Live feed under running work, and provider logos</div><div class="gs"><span class="lead">CLAUDE</span>сегодня 00:50</div></span><span></span></button>
    <button class="g fin"><span class="st done"><i class="ph ph-check-circle"></i></span><span><div class="gt">Simpler start: Node 22, --version, serve --open</div><div class="gs"><span class="lead">CLAUDE</span>сегодня 00:30</div></span><span></span></button>
   </div>
  </div></div>
 </section>
 <section class="proj" id="p2">
  <button class="phd" aria-expanded="true" onclick="tog('p2',this)"><i class="ph ph-caret-down car"></i><span>gaalo-studio-frontend</span><span class="sum"><span class="badge">1</span></span></button>
  <div class="list"><div>
   <button class="g"><span class="st ask"><i class="ph ph-hand-waving"></i></span><span><div class="gt">Интеграции в Studio как во Flowise + пилот «Пресс-релизы»</div><div class="gs"><span class="lead">CLAUDE</span><span class="ask">1 ждёт вас</span>· 1 идёт</div></span><span class="right"><span class="badge">1</span></span></button>
   <button class="g"><span class="st lead"><i class="ph ph-question"></i></span><span><div class="gt">Онбординг агентов</div><div class="gs"><span class="lead">CODEX</span>ждёт ведущего</div></span><span></span></button>
   <button class="g"><span class="st pause"><i class="ph ph-pause-circle"></i></span><span><div class="gt">SSRF-аудит и защита в harness</div><div class="gs"><span class="lead">CLAUDE</span>на паузе: ведущий молчит 2 дня</div></span><span></span></button>
  </div></div>
 </section>
</aside>
<p class="note">Макет сайдбара. Кликните по названию проекта, чтобы свернуть, и по «Завершено 4», чтобы раскрыть. Цели сортируются так: ждёт вас, идёт, ждёт ведущего, на паузе, а завершённые внизу, свёрнутые.</p>
</div>
