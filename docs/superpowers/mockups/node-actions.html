<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Действия поручения</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--surface:#fff;--surface-2:#f0f0ed;--line:#e3e3df;--line-strong:#cfcfca;--text:#18181b;--text-2:#55555c;--text-3:#85858c;--accent:#c2410c;--accent-soft:#fdeee5;--accent-text:#9a330a;--danger:#b42318;--danger-soft:#fdecea;--ease-out:cubic-bezier(.23,1,.32,1);--r:10px;--r-sm:7px}
:root[data-theme=dark]{color-scheme:dark;--bg:#111113;--surface:#18181b;--surface-2:#1f1f23;--line:#2a2a2f;--line-strong:#3a3a40;--text:#ededef;--text-2:#a7a7ae;--text-3:#75757c;--accent:#f0884f;--accent-soft:#3a2216;--accent-text:#f6a77a;--danger:#f2786b;--danger-soft:#3a1915}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[hidden]{display:none!important}
.stage{min-height:100dvh;display:flex;justify-content:center;padding:32px 16px}
.col{width:420px;max-width:100%}
.bar{display:flex;justify-content:flex-end;margin-bottom:10px}
.tog{font-size:12px;color:var(--text-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:8px;margin:6px 0 16px;font-size:12.5px;color:var(--text-2)}
.av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}.av svg{width:13px;height:13px}
.pending{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent-text);border-radius:var(--r-sm);padding:9px 10px;font-size:12.5px;margin-bottom:16px}
.pending .ph{font-size:16px}.pending b{font-weight:500}
.cap{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-3);margin:0 2px 6px}
.tip{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--text-3)}
.tip .bubble{position:absolute;right:-4px;top:26px;width:240px;padding:8px 10px;border-radius:8px;background:var(--text);color:var(--bg);font-size:12px;line-height:1.4;opacity:0;transform:scale(.97) translateY(-2px);transform-origin:top right;pointer-events:none;transition:opacity 125ms var(--ease-out),transform 125ms var(--ease-out);z-index:5}
.tip:hover .bubble,.tip:focus-visible .bubble{opacity:1;transform:none;transition-delay:350ms}
.list{display:grid;gap:2px}
.act{border-radius:var(--r-sm)}
.row{display:grid;grid-template-columns:28px 1fr 16px;gap:10px;align-items:center;width:100%;padding:8px;border-radius:var(--r-sm);transition:transform 140ms var(--ease-out),background-color 140ms ease}
.row:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--surface-2)}}
.act.open>.row{background:var(--surface-2)}
.ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:15px}
.tt{font-size:13.5px;font-weight:500;line-height:1.25}.sub{font-size:12px;color:var(--text-3);line-height:1.3;margin-top:1px}
.chev{color:var(--text-3);font-size:13px;transition:transform 200ms var(--ease-out)}.act.open .chev{transform:rotate(90deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease-out)}
.act.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.act.open .body>div{overflow:visible;animation:clipin 220ms}
@keyframes clipin{from{overflow:hidden}to{overflow:hidden}}
.inner{position:relative;padding:6px 8px 10px 46px}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:8px 10px;outline:none;transition:border-color 140ms ease}
textarea:focus{border-color:var(--accent)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:11.5px;color:var(--text-3)}
.kbd{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--text-2)}
.send{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;background:var(--text);color:var(--bg);font-size:12.5px;font-weight:500;white-space:nowrap;transition:transform 140ms var(--ease-out),opacity 140ms}
.send:active{transform:scale(.97)}.send:disabled{opacity:.4;cursor:default}
.agents{display:grid;gap:4px}
.ag{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:6px 6px 6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform 140ms var(--ease-out),border-color 140ms}
.ag:active{transform:scale(.99)}
@media (hover:hover) and (pointer:fine){.ag:hover{border-color:var(--line-strong)}}
.ag[aria-checked=true]{border-color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px 0 10px;border-radius:999px;font-size:12px;color:var(--text-3);border:1px solid transparent;transition:transform 140ms var(--ease-out),background-color 140ms,border-color 140ms,color 140ms}
.chip i{font-size:11px;transition:transform 200ms var(--ease-out)}
.chip:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.chip:hover{background:var(--surface-2);color:var(--text)}}
.ag[aria-checked=true] .chip{border-color:var(--line);color:var(--text)}
.chip[aria-expanded=true]{background:var(--surface-2)}.chip[aria-expanded=true] i{transform:rotate(180deg)}
.chip .e{color:var(--accent-text)}
.state{display:inline-grid}.state>span{grid-area:1/1;transition:opacity 200ms ease,filter 200ms ease}
.state .b{opacity:0;filter:blur(2px)}.done .state .a{opacity:0;filter:blur(2px)}.done .state .b{opacity:1;filter:none}.done .sub{color:var(--accent-text)}
hr{border:0;border-top:1px solid var(--line);margin:14px 2px}
.hold{position:relative;overflow:hidden;width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:8px;border-radius:var(--r-sm);color:var(--danger);transition:transform 140ms var(--ease-out);user-select:none;-webkit-user-select:none;touch-action:none}
.hold .ic{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger);background:transparent}
.hold .sub{color:color-mix(in srgb,var(--danger) 75%,var(--text-3))}
.hold::before{content:"";position:absolute;inset:0;background:var(--danger-soft);clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--ease-out)}
.hold.holding::before{clip-path:inset(0 0 0 0);transition:clip-path 1200ms linear}.hold.holding{transform:scale(.985)}
.hold>*{position:relative}.hold.stopped::before{clip-path:inset(0 0 0 0)}
.pop{position:absolute;z-index:10;width:280px;padding:14px 14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.08),0 16px 40px rgb(0 0 0/.2);transform-origin:top right;animation:pop 150ms var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.mi .s{font-size:11.5px;color:var(--text-3);display:block;margin-top:1px}.mi .k{font-size:12px;color:var(--text-3)}.mi .ph-check{color:var(--accent);font-size:15px}
@media (hover:hover) and (pointer:fine){.mi:hover{background:var(--surface-2)}}
.mi:focus-visible{background:var(--surface-2);outline:none}
.msep{height:1px;background:var(--line);margin:5px 4px}
.pop{width:268px;padding:6px}
.ph-head{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:6px 6px 8px}
.pt{display:grid;line-height:1.25}.pt b{font-size:13px;font-weight:500}.pt span{font-size:11.5px;color:var(--text-3)}
.reset{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-3);padding:3px 6px;border-radius:6px;transition:color 140ms,background-color 140ms}
@media (hover:hover) and (pointer:fine){.reset:hover{color:var(--text);background:var(--surface-2)}}
.sec{font-size:11px;color:var(--text-3);padding:6px 8px 4px}
.mi{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;width:100%;padding:6px 8px;border-radius:7px;font-size:13px}
.mi .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center}
.mi[aria-selected=true] .dot{border-color:var(--accent)}.mi[aria-selected=true] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mi .s{font-size:11.5px;color:var(--text-3);margin-left:6px}.mi .k{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;color:var(--text-3)}
.mcustom{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center;padding:4px 8px}
.mcustom i{color:var(--text-3);font-size:13px}
.mcustom input{height:26px;border:0;border-bottom:1px dashed var(--line-strong);background:transparent;color:var(--text);font:inherit;font-size:12.5px;padding:0;outline:none}
.mcustom input:focus{border-bottom-color:var(--accent);border-bottom-style:solid}
.psep{height:1px;background:var(--line);margin:6px 4px 2px}
.effHead{display:flex;justify-content:space-between}.effVal{color:var(--accent-text);font-weight:500;transition:opacity 110ms ease,filter 110ms ease}.effVal.swap{opacity:0;filter:blur(2px)}
.meter{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:32px;padding:0 8px 8px;outline-offset:2px;border-radius:6px;cursor:pointer;touch-action:none}
.meter .bar{border-radius:3px;background:var(--surface-2);border:1px solid var(--line);transition:background-color 160ms var(--ease-out),border-color 160ms var(--ease-out),transform 140ms var(--ease-out)}
.meter .bar.on{background:var(--accent);border-color:var(--accent)}
@media (hover:hover) and (pointer:fine){.meter .bar:hover{transform:scaleY(1.06)}}
.meter .lbl{display:none}
.na{font-size:12px;color:var(--text-3);padding:0 8px 8px;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation:none!important}}
</style></head><body>
<div class="stage"><div class="col">
<div class="bar"><button class="tog" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Тема</button></div>
<section class="panel">
<h2>Support Node.js 22.15 and newer</h2>
<div class="meta"><span class="av" data-logo="codex"></span>Codex · идёт 6 мин</div>
<div class="pending" id="pending" hidden><i class="ph ph-hourglass-medium"></i><span>Ведущий решает: <b id="pendingText"></b></span></div>
<div class="cap"><span>Попросить ведущего</span><button class="tip" aria-label="Как работают просьбы"><i class="ph ph-info"></i><span class="bubble" role="tooltip">Это не команды, а просьбы. Ведущий решает каждую и объясняет решение, ответ появится здесь.</span></button></div>
<div class="list">
 <div class="act" id="clarify">
  <button class="row" aria-expanded="false" onclick="toggle('clarify')"><span class="ic"><i class="ph ph-note-pencil"></i></span><span><div class="tt">Уточнить задачу</div><div class="sub">Указание исполнителю по ходу работы</div></span><i class="ph ph-caret-right chev"></i></button>
  <div class="body"><div><div class="inner">
   <textarea id="ta" placeholder="Например: не трогай release.yml, проверь только CI"></textarea>
   <div class="foot"><span><span class="kbd">⌘</span> <span class="kbd">Enter</span> отправить</span><button class="send" id="sendBtn" disabled onclick="ask('уточнение задачи')">Отправить ведущему</button></div>
  </div></div></div>
 </div>
 <div class="act" id="handoff">
  <button class="row" aria-expanded="false" onclick="toggle('handoff')"><span class="ic"><i class="ph ph-arrows-left-right"></i></span><span><div class="tt">Передать другому агенту</div><div class="sub">Работа начнётся заново у выбранного</div></span><i class="ph ph-caret-right chev"></i></button>
  <div class="body"><div><div class="inner" id="hinner">
   <div class="agents" role="radiogroup" aria-label="Кому передать" id="agents"></div>
   <div class="foot" id="hfoot" hidden><span id="summary"></span><button class="send" onclick="ask('передать '+sumText())">Попросить передать</button></div>
   <div class="pop" id="pop" role="dialog" aria-label="Модель и effort" hidden>
    <div class="ph-head"><span class="av" id="pAv"></span><span class="pt"><b id="pAgent"></b><span id="pModel"></span></span><button class="reset" onclick="resetCfg()" aria-label="Вернуть модель и effort по умолчанию"><i class="ph ph-arrow-counter-clockwise"></i> Сбросить</button></div>
    <div class="sec">Модель</div>
    <div id="mlist" role="listbox" aria-label="Модель"></div>
    <div class="mcustom"><i class="ph ph-plus"></i><input id="mc" placeholder="Другая модель"></div>
    <div class="psep"></div>
    <div class="sec effHead"><span>Effort</span><span class="effVal" id="effVal"></span></div>
    <div class="meter" id="meter" role="slider" tabindex="0" aria-label="Effort"></div>
    <div class="na" id="noEff" hidden>Этот агент не принимает effort: работает с настройками своей модели</div>
   </div>
  </div></div></div>
 </div>
 <div class="act" id="stop">
  <button class="row" onclick="ask('остановить');this.closest('.act').classList.add('done')"><span class="ic"><i class="ph ph-stop"></i></span><span><div class="tt">Остановить</div><div class="sub state"><span class="a">Это поручение и всё, что под ним</span><span class="b">Просьба у ведущего</span></div></span><span></span></button>
 </div>
 <div class="act" id="discuss">
  <button class="row" onclick="copied(this)"><span class="ic"><i class="ph ph-chats-circle"></i></span><span><div class="tt">Обсудить в чате ведущего</div><div class="sub state"><span class="a">Скопирует ссылку на поручение</span><span class="b">Скопировано, вставьте в чат</span></div></span><i class="ph ph-copy chev"></i></button>
 </div>
</div>
<hr>
<button class="hold" id="hold" aria-label="Аварийная остановка: удерживайте"><span class="ic"><i class="ph ph-octagon"></i></span><span><div class="tt" id="holdT">Аварийная остановка</div><div class="sub" id="holdS">Удерживайте: сразу, без ведущего</div></span></button>
</section></div></div>

const EFF_RU={none:'Без размышлений',minimal:'Минимальное',low:'Низкое',medium:'Среднее',high:'Высокое',xhigh:'Очень высокое',max:'Максимальное'};
const CAT={claude:{label:'Claude',def:'sonnet',models:[['sonnet','Sonnet 5.5','баланс скорости и качества'],['opus','Opus 5.5','сложные задачи'],['fable','Fable 5.1','самые длинные задачи'],['haiku','Haiku 5.5','быстро и дёшево']],efforts:['low','medium','high','xhigh','max'],effDef:'high'},
codex:{label:'Codex',def:'gpt-6.1-sol',models:[['gpt-6.1-sol','GPT-6.1 Sol'],['gpt-6-astra','GPT-6 Astra'],['gpt-6.1-terra','GPT-6.1 Terra'],['gpt-6-luna','GPT-6 Luna']],efforts:['minimal','low','medium','high','xhigh','max'],effDef:'medium'},
deepseek:{label:'DeepSeek',def:'deepseek-flash',models:[['deepseek-flash','DeepSeek Flash'],['deepseek-pro','DeepSeek Pro']],efforts:[],effDef:''},
kimi:{label:'Kimi',def:'moonshot/kimi-k3',models:[['moonshot/kimi-k3','Kimi K3']],efforts:[],effDef:''}};
const $=id=>document.getElementById(id);
document.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=LOGOS[e.dataset.logo]);
$('agents').innerHTML=Object.keys(CAT).map(k=>'<div class="ag" role="radio" aria-checked="false" tabindex="0" data-agent="'+k+'"><span class="av">'+LOGOS[k]+'</span><span>'+CAT[k].label+'</span><button class="chip" aria-haspopup="dialog" aria-expanded="false"><span class="cl"></span><i class="ph ph-caret-down"></i></button></div>').join('');
let sel={};const cfg={};
for(const k in CAT)cfg[k]={model:CAT[k].def,effort:CAT[k].effDef};
const nameOf=(c,m)=>(c.models.find(x=>x[0]===m)||[m,m])[1];
const cur=()=>cfg[sel.agent];
function sumText(){const c=CAT[sel.agent],v=cur();return c.label+', '+nameOf(c,v.model)+(v.effort?', '+EFF_RU[v.effort].toLowerCase():'')}
function paintChips(){document.querySelectorAll('.ag').forEach(a=>{const k=a.dataset.agent,c=CAT[k],v=cfg[k];a.querySelector('.cl').innerHTML=nameOf(c,v.model)+(v.effort?' <span class="e">'+EFF_RU[v.effort].toLowerCase()+'</span>':'')})}
function toggle(id){document.querySelectorAll('.act.open').forEach(a=>{if(a.id!==id){a.classList.remove('open');a.querySelector('.row').setAttribute('aria-expanded','false')}});const a=$(id),o=a.classList.toggle('open');a.querySelector('.row').setAttribute('aria-expanded',o);if(!o)closePop(true);if(id==='clarify'&&o)setTimeout(()=>$('ta').focus(),60)}
function ask(text){$('pending').hidden=false;$('pendingText').textContent=text;closePop(true);document.querySelectorAll('.act.open').forEach(a=>{a.classList.remove('open');a.querySelector('.row').setAttribute('aria-expanded','false')})}
function copied(b){const a=b.closest('.act');a.classList.add('done');setTimeout(()=>a.classList.remove('done'),1600)}
$('ta').addEventListener('input',e=>$('sendBtn').disabled=!e.target.value.trim());
$('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.value.trim())ask('уточнение задачи');if(e.key==='Escape')toggle('clarify')});
function pick(a){document.querySelectorAll('.ag').forEach(x=>x.setAttribute('aria-checked',x===a));sel.agent=a.dataset.agent;$('hfoot').hidden=false;$('summary').textContent=sumText()}
document.querySelectorAll('.ag').forEach(a=>{a.addEventListener('click',e=>{const chip=e.target.closest('.chip');pick(a);if(chip)openPop(chip);else closePop(true)});a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(a)}})});
function draw(swap){const c=CAT[sel.agent],v=cur();$('pAv').innerHTML=LOGOS[sel.agent];$('pAgent').textContent=c.label;$('pModel').textContent=nameOf(c,v.model);
 $('mlist').innerHTML=c.models.map((m,k)=>'<button class="mi" role="option" aria-selected="'+(m[0]===v.model)+'" data-m="'+m[0]+'"><span class="dot"></span><span>'+m[1]+(m[0]===c.def?'<span class="s">по умолчанию</span>':(m[2]?'<span class="s">'+m[2]+'</span>':''))+'</span><span class="k">'+(k+1)+'</span></button>').join('');
 $('mlist').querySelectorAll('.mi').forEach(b=>b.onclick=()=>{v.model=b.dataset.m;draw()});
 const n=c.efforts.length,m=$('meter'),val=$('effVal');m.hidden=!n;$('noEff').hidden=!!n;
 if(n){const i=c.efforts.indexOf(v.effort);m.innerHTML=c.efforts.map((e,k)=>'<span class="bar'+(k<=i?' on':'')+'" style="height:'+Math.round(8+16*k/(n-1))+'px" data-i="'+k+'" title="'+EFF_RU[e]+'"></span>').join('');
  m.setAttribute('aria-valuemin',0);m.setAttribute('aria-valuemax',n-1);m.setAttribute('aria-valuenow',i);m.setAttribute('aria-valuetext',EFF_RU[v.effort]);
  if(swap){val.classList.add('swap');setTimeout(()=>{val.textContent=EFF_RU[v.effort].toLowerCase();val.classList.remove('swap')},110)}else val.textContent=EFF_RU[v.effort].toLowerCase()}
 else val.textContent='';
 $('summary').textContent=sumText();paintChips()}
function setEffort(i){const c=CAT[sel.agent],e=c.efforts[Math.max(0,Math.min(c.efforts.length-1,i))];if(e!==cur().effort){cur().effort=e;draw(true)}}
const me=$('meter');
const idxAt=x=>{const c=CAT[sel.agent],r=me.getBoundingClientRect();return Math.floor((x-r.left)/r.width*c.efforts.length)};
let dragging=false;
me.addEventListener('pointerdown',e=>{me.setPointerCapture(e.pointerId);dragging=true;setEffort(idxAt(e.clientX))});
me.addEventListener('pointermove',e=>{if(dragging)setEffort(idxAt(e.clientX))});
['pointerup','pointercancel'].forEach(t=>me.addEventListener(t,()=>dragging=false));
me.addEventListener('keydown',e=>{const c=CAT[sel.agent],i=c.efforts.indexOf(cur().effort);if(['ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();setEffort(i+1)}if(['ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();setEffort(i-1)}});
function resetCfg(){const c=CAT[sel.agent];cfg[sel.agent]={model:c.def,effort:c.effDef};draw(true)}
let chipEl=null;const pop=$('pop');
function openPop(chip){if(!pop.hidden&&chipEl===chip)return closePop();chipEl=chip;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-expanded',c===chip));
 const host=$('hinner').getBoundingClientRect(),r=chip.getBoundingClientRect();pop.style.top=(r.bottom-host.top+6)+'px';pop.style.right=(host.right-r.right)+'px';
 pop.hidden=false;pop.style.animation='none';void pop.offsetHeight;pop.style.animation='';draw();(pop.querySelector('.mi[aria-selected=true]')||pop.querySelector('.mi')).focus()}
function closePop(silent){if(pop.hidden)return;pop.hidden=true;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-expanded','false'));if(!silent&&chipEl)chipEl.focus()}
$('mc').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){cur().model=e.target.value.trim();e.target.value='';draw()}});
document.addEventListener('keydown',e=>{if(pop.hidden)return;if(e.key==='Escape')closePop();const d=Number(e.key);if(d>0&&document.activeElement.id!=='mc'){const c=CAT[sel.agent];if(c.models[d-1]){cur().model=c.models[d-1][0];draw()}}});
document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('.chip'))closePop(true)});
const h=$('hold');let t;
const start=()=>{if(h.classList.contains('stopped'))return;h.classList.add('holding');t=setTimeout(()=>{h.classList.remove('holding');h.classList.add('stopped');$('holdT').textContent='Остановлено';$('holdS').textContent='Запуск прерван, ведущий получит событие'},1200)};
const end=()=>{clearTimeout(t);h.classList.remove('holding')};
h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);start()});['pointerup','pointercancel'].forEach(x=>h.addEventListener(x,end));
h.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start()}});h.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')end()});
paintChips();
</script></body></html>
