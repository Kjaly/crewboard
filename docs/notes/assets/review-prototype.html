function render(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('lang').textContent=state.lang==='en'?'RU':'EN';$('mode').textContent=state.example?t('actual'):t('example');$('w1440').setAttribute('aria-pressed',state.width===1440);$('w1100').setAttribute('aria-pressed',state.width===1100);$('viewport').classList.toggle('w1100',state.width===1100);$('stamp').textContent=`${t('snapshot')}: ${data.snapshotAt} · ${t('source')} ${data.planRev}`;$('scope').textContent=state.example?t('exampleTag')+' · '+data.planGoal:date(data.snapshotAt)+' · '+data.planGoal;renderNeeds();renderProgress();renderResources();renderRuns()}
function renderNeeds(){let n=state.example?2:data.taskStatus.in_review||0;let quiet=n===0;$('needs').classList.toggle('quiet',quiet);$('needs').innerHTML=`<div><div class="eyebrow">${t('needs')}</div><h2>${quiet?t('noDecision'):n+' '+t('waiting').toLowerCase()}</h2><p>${quiet?t('quietNeed'):t('exampleNeed')}</p></div><div class="needs-actions"><div class="count">${n}</div><button class="action" id="needsBtn">${quiet?t('viewRuns'):t('openWaiting')} →</button></div>`;$('needsBtn').onclick=()=>{document.querySelector('.runs-top').scrollIntoView({behavior:'smooth',block:'start'})}}
function renderProgress(){let s=data.taskStatus;let total=data.tasksTotal-(s.superseded||0);let a=state.example?{accepted:13,ready:5,backlog:2,in_review:2,rejected:1,superseded:0}:s;let denom=state.example?23:total;let segments=[['accepted',a.accepted||0,'var(--orc-ok)'],['running',state.example?1:data.runningRuns,'var(--orc-accent-strong)'],['ready',Math.max(0,(a.ready||0)-(state.example?1:data.runningRuns)),'var(--orc-accent)'],['backlog',a.backlog||0,'var(--orc-fg3)'],['stuck',(a.rejected||0)+(a.in_review||0),'var(--orc-warn)']];$('progressScope').textContent=state.example?t('exampleTag'):`${fmt(total)} ${t('open').toLowerCase()} + ${fmt(s.superseded||0)} ${t('superseded').toLowerCase()}`;$('progressNumber').innerHTML=`${fmt(a.accepted||0)} <small>/ ${fmt(denom)} ${t('accepted').toLowerCase()} · ${fmt(state.example?1:data.runningRuns)} ${t('running').toLowerCase()}</small>`;$('progressBar').innerHTML=segments.map(([k,v,c])=>`<i style="width:${v/denom*100}%;background:${c}" title="${esc(t(k))}: ${v}"></i>`).join('');$('progressBar').setAttribute('aria-label',segments.map(([k,v])=>`${t(k)} ${v}`).join(', '));$('progressKey').innerHTML=segments.map(([k,v,c])=>`<span><i class="mini-dot" style="background:${c}"></i>${t(k)} <b>${fmt(v)}</b></span>`).join('')+`<span><em>${t('history')}: ${fmt(data.verdict.result||0)} ${t('acceptedResult').toLowerCase()}, ${fmt(data.verdict.disputed||0)} ${t('disputed').toLowerCase()}, ${fmt(data.verdict.legacy_unknown||0)} ${t('legacy').toLowerCase()}</em></span>`;let elapsed=(new Date(data.snapshotAt)-new Date(data.firstRunAt))/1000;$('elapsed').textContent=dur(elapsed);$('paceLines').innerHTML=`<div><span>${t('worker')}</span><strong>${dur(data.workerSeconds)}</strong><div class="pace-line"><i style="width:${Math.min(100,data.workerSeconds/elapsed*100)}%;background:var(--orc-accent-strong)"></i></div></div><div><span>${t('reviewWait')}</span><strong>${t('notObserved')}</strong><div class="pace-line"><i style="width:0"></i></div></div>`}
function renderResources(){$('resources').innerHTML=`<article class="resource"><h3>${t('quota')}</h3><strong>+${fmt(data.quotaDeltaPctLegacy)} pp</strong><p>${t('quotaNote')}</p><div class="tinybar"><i style="width:39%;background:var(--orc-warn)"></i></div></article><article class="resource"><h3>${t('money')}</h3><strong>≈ ${usd(data.observedUsd)}</strong><p>${t('moneyNote')}</p><div class="tinybar"><i style="width:${Math.max(2,data.observedUsdRuns/data.runsTotal*100)}%;background:var(--orc-k-tool)"></i></div></article><article class="resource"><h3>${t('cash')}</h3><strong>${t('notObserved')}</strong><p>${t('cashNote')}</p><div class="tinybar"><i style="width:0"></i></div></article>`}
function renderRuns(){let rows=data.featured.filter(r=>(r.taskId+' '+r.taskTitle+' '+r.runId+' '+r.worker).toLocaleLowerCase().includes(state.query.toLocaleLowerCase()));$('runCount').textContent=`${fmt(rows.length)} ${t('runCount')} ${fmt(data.runsTotal)}`;$('search').placeholder=t('search');$('search').value=state.query;$('runList').innerHTML=rows.length?rows.map(r=>`<button type="button" class="run-row ${r.runId===state.selected?'selected':''}" data-run="${esc(r.runId)}"><div class="row-head"><strong>${esc(r.taskId)} · ${esc(r.taskTitle)}</strong>${statusHTML(r)}</div><div class="row-meta">${esc(r.worker)} · ${t('attempt')} ${r.attempt} · ${date(r.startedAt)}</div>${stepsHTML(r)}</button>`).join(''):`<div class="empty-runs">${data.runsTotal?(state.query?`${t('noMatches')} <button id="clearSearch" type="button">${t('clearSearch')}</button>`:t('notObserved')):t('empty')}</div>`;if($('clearSearch'))$('clearSearch').onclick=()=>{state.query='';renderRuns()};document.querySelectorAll('[data-run]').forEach(el=>el.onclick=()=>{state.selected=el.dataset.run;state.step=0;$('viewport').classList.add('detail-open');renderRuns()});$('legend').innerHTML=['model','tool','edit','check','steer','problem'].map(k=>`<span><i style="background:${colors[k]}"></i>${code[k]} ${t(k)}</span>`).join('');renderDetail()}
function renderDetail(){let r=data.featured.find(x=>x.runId===state.selected);if(!r){$('detail').innerHTML='';return}let step=r.steps?.[state.step]||r.steps?.[0];let duration=(new Date(r.finishedAt||data.snapshotAt)-new Date(r.startedAt))/1000;$('detail').innerHTML=`<div class="detail-head"><button type="button" class="back" id="back">${t('back')}</button><div class="eyebrow">${t('detail')} · ${esc(r.taskId)} · ${t('attempt')} ${r.attempt}</div><h3>${esc(r.taskTitle)}</h3><div class="mono">${esc(r.runId)}</div><div style="margin-top:7px">${statusHTML(r)}</div><div class="detail-metrics"><div>${t('duration')}<strong>${dur(duration)}</strong></div><div>${t('worker')}<strong>${esc(r.worker)}</strong></div><div>${t('quota')}<strong>${r.quotaDeltaPct===null?t('notObserved'):'+'+fmt(r.quotaDeltaPct)+' pp'}</strong></div></div><div style="margin-top:12px">${stepsHTML(r)}</div></div><div class="ledger"><h4>${t('ledger')} · ${r.steps?.length||0} ${t('stepSample').toLowerCase()}</h4><div class="ledger-scroll">${(r.steps||[]).map((s,i)=>`<button type="button" class="ledger-row" data-step="${i}" aria-pressed="${i===state.step}"><b>${i+1}</b><span class="ledger-icon" style="color:${colors[s.kind]}">${code[s.kind]}</span><span>${esc(t(s.kind))} · ${esc(s.label)}</span></button>`).join('')||t('noSteps')}</div><div class="inspector">${step?`<strong>#${state.step+1} · ${t(step.kind)}</strong><br>${esc(step.label)}<br>${t('stepTime')}: ${date(step.at)}`:t('selectStep')}<br><span style="color:var(--orc-fg3)">${t('sampleNotice')}</span></div></div>`;$('back').onclick=()=>$('viewport').classList.remove('detail-open');document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{state.step=Number(el.dataset.step);renderDetail()})}
$('lang').onclick=()=>{state.lang=state.lang==='en'?'ru':'en';render()};$('w1440').onclick=()=>{state.width=1440;render()};$('w1100').onclick=()=>{state.width=1100;$('viewport').classList.add('detail-open');render()};$('mode').onclick=()=>{state.example=!state.example;render()};$('search').oninput=e=>{state.query=e.target.value;renderRuns()};render();
</script></body></html>
