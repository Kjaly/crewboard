name: Bug report
description: Report a reproducible problem in the crewboard CLI or the dsh-crewboard plugin
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not report security issues here; see SECURITY.md for the private route.
        Remove local paths, account names, and tokens from logs before posting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: The command or screen action, what you expected, and what happened instead. Include the full output if there is any.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - crewboard CLI
        - dsh screen (dsh-crewboard plugin)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions and environment
      description: "`npm ls -g crewboard`, `node --version`, `dsh --version` if the plugin is involved, the worker CLI and its version, and your operating system."
      placeholder: crewboard 0.3.0, Node 24.16, dsh 0.1.5, Claude Code 2.1.281, macOS
    validations:
      required: true
